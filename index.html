<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Archivos P2P Directo (Sin Servidor)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; text-align: center; background-color: #f4f7f6; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: left; }
        h1, h3 { text-align: center; margin-top: 0; }
        textarea { width: 100%; height: 80px; box-sizing: border-box; resize: none; font-family: monospace; font-size: 11px; margin: 5px 0; }
        input[type="file"], button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #218838; }
        .btn-connect { background-color: #007bff; }
        .btn-connect:hover { background-color: #0056b3; }
        .status { font-weight: bold; text-align: center; color: #555; margin: 15px 0; padding: 10px; background: #e9ecef; border-radius: 4px; }
        #downloadLink { display: none; text-align: center; margin-top: 15px; font-weight: bold; color: #28a745; text-decoration: none; }
    </style>
</head>
<body>

    <h1>Transferencia P2P Manual</h1>
    <div id="status" class="status">Paso 1: Elige si vas a Crear la conexión o a Unirte.</div>

    <!-- PASO 1: CREAR INVITACIÓN (PC 1) -->
    <div class="box">
        <h3>Opción A: Iniciar Conexión (PC 1)</h3>
        <button id="btn-init">1. Generar Invitación</button>
        <label>Copia este código y envíaselo a la otra PC:</label>
        <textarea id="txt-local-offer" readonly placeholder="Haz clic en el botón de arriba..."></textarea>
        
        <label style="margin-top: 10px; display:block;">3. Pega aquí la Respuesta que te envíe la otra PC:</label>
        <textarea id="txt-remote-answer" placeholder="Pega el código de respuesta aquí..."></textarea>
        <button id="btn-accept-answer" class="btn-connect">4. Completar Conexión</button>
    </div>

    <!-- PASO 2: UNIRSE A INVITACIÓN (PC 2) -->
    <div class="box">
        <h3>Opción B: Unirse a Conexión (PC 2)</h3>
        <label>1. Pega el código de Invitación que recibiste de la PC 1:</label>
        <textarea id="txt-remote-offer" placeholder="Pega el código de invitación aquí..."></textarea>
        <button id="btn-join" class="btn-connect">2. Procesar y Generar Respuesta</button>
        
        <label style="margin-top: 10px; display:block;">3. Copia este código de Respuesta y envíaselo a la PC 1:</label>
        <textarea id="txt-local-answer" readonly placeholder="Aparecerá tu respuesta aquí..."></textarea>
    </div>

    <!-- PASO 3: COMPARTIR ARCHIVOS -->
    <div class="box" style="border: 2px dashed #007bff;">
        <h3>3. Enviar Archivo (Una vez conectados)</h3>
        <input type="file" id="file-input">
        <button id="btn-send" style="background-color: #007bff;">Enviar Archivo</button>
        <center><a id="downloadLink" href="#" download>¡Descargar Archivo Recibido!</a></center>
    </div>

    <script>
        // Configuración básica usando los servidores públicos de Google para validar las IPs locales (STUN)
        const config = { iceServers: [{ urls: 'stun:://google.com' }] };
        let pc = new RTCPeerConnection(config);
        let dataChannel = null;

        // Elementos del DOM
        const status = document.getElementById('status');
        const fileInput = document.getElementById('file-input');
        const downloadLink = document.getElementById('downloadLink');

        // --- FLUJO PC 1: INICIADOR ---
        document.getElementById('btn-init').addEventListener('click', async () => {
            status.innerText = "Generando invitación...";
            dataChannel = pc.createDataChannel("fileTransfer");
            setupDataChannelHandlers(dataChannel);

            // Recopilar candidatos de red para la conexión directa
            pc.onicecandidate = (e) => {
                if (!e.candidate) {
                    // Cuando termina de recopilar, mostramos el código completo en el cuadro de texto
                    document.getElementById('txt-local-offer').value = btoa(JSON.stringify(pc.localDescription));
                    status.innerText = "Invitación lista. Cópiala y envíala a la otra PC.";
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
        });

        document.getElementById('btn-accept-answer').addEventListener('click', async () => {
            const answerStr = document.getElementById('txt-remote-answer').value.trim();
            if (!answerStr) return alert("Pega el código de respuesta de la PC 2.");
            
            try {
                const answer = JSON.parse(atob(answerStr));
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
                status.innerText = "Procesando respuesta final...";
            } catch (err) {
                alert("Código de respuesta inválido.");
            }
        });

        // --- FLUJO PC 2: RECEPTOR ---
        document.getElementById('btn-join').addEventListener('click', async () => {
            const offerStr = document.getElementById('txt-remote-offer').value.trim();
            if (!offerStr) return alert("Pega el código de invitación de la PC 1.");

            try {
                const offer = JSON.parse(atob(offerStr));
                
                pc.ondatachannel = (e) => {
                    dataChannel = e.channel;
                    setupDataChannelHandlers(dataChannel);
                };

                pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        document.getElementById('txt-local-answer').value = btoa(JSON.stringify(pc.localDescription));
                        status.innerText = "Respuesta generada. Cópiala y devuélvesela a la PC 1.";
                    }
                };

                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
            } catch (err) {
                alert("Código de invitación inválido.");
            }
        });

        // --- MANEJO DEL CANAL DE DATOS P2P ---
        function setupDataChannelHandlers(channel) {
            channel.onopen = () => status.innerText = "¡CONECTADOS EXITOSAMENTE de PC a PC!";
            channel.onclose = () => status.innerText = "Conexión cerrada.";
            
            channel.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.file && data.filename) {
                        status.innerText = `¡Archivo recibido!: ${data.filename}`;
                        
                        // Convertir los datos en base64 de vuelta a un archivo descargable
                        const byteCharacters = atob(data.file);
                        const byteNumbers = new Array(byteCharacters.length);
                        for (let i = 0; i < byteCharacters.length; i++) {
                            byteNumbers[i] = byteCharacters.charCodeAt(i);
                        }
                        const byteArray = new Uint8Array(byteNumbers);
                        const blob = new Blob([byteArray]);
                        
                        const url = URL.createObjectURL(blob);
                        downloadLink.href = url;
                        downloadLink.download = data.filename;
                        downloadLink.innerText = `Descargar ${data.filename}`;
                        downloadLink.style.display = "block";
                    }
                } catch (err) {
                    console.error("Error al procesar el archivo recibido", err);
                }
            };
        }

        // --- ENVIAR ARCHIVO ---
        document.getElementById('btn-send').addEventListener('click', () => {
            if (!dataChannel || dataChannel.readyState !== "open") {
                return alert("Las PCs aún no están conectadas.");
            }
            const files = fileInput.files;
            if (files.length === 0) return alert("Selecciona un archivo.");

            const file = files[0];
            status.innerText = `Enviando "${file.name}"...`;

            const reader = new FileReader();
            reader.onload = function(event) {
                // Convertimos el archivo a Base64 para enviarlo de forma segura por la cadena de texto nativa de WebRTC
                const base64File = btoa(
                    new Uint8Array(event.target.result)
                        .reduce((data, byte) => data + String.fromCharCode(byte), '')
                );

                dataChannel.send(JSON.stringify({
                    file: base64File,
                    filename: file.name
                }));
                statusDisplay = status.innerText = `¡"${file.name}" enviado con éxito!`;
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
