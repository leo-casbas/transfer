<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartir Archivos P2P Directo</title>
    
    <!-- SOLUCIÓN 1: Cambiamos a la última versión oficial y estable desde jsDelivr -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; background-color: #f4f7f6; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { padding: 10px; margin: 10px 0; width: 100%; max-width: 400px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .status { font-weight: bold; color: #555; margin: 15px 0; }
        #downloadLink { display: none; margin-top: 15px; font-weight: bold; color: #28a745; }
        .error-msg { color: #dc3545; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Transferencia de Archivos P2P</h1>
    
    <div class="box">
        <h3>1. Tu Identificador de Conexión</h3>
        <p>Comparte este ID con la otra persona.</p>
        <!-- Aquí se mostrará tu ID -->
        <div id="my-id" style="font-size: 1.5em; color: #007bff; font-weight: bold;">Generando ID único...</div>
        <div id="error-log" class="error-msg"></div>
    </div>

    <div class="box">
        <h3>2. Conectar y Enviar Archivo</h3>
        <input type="text" id="peer-id-input" placeholder="Introduce el ID del destinatario">
        <br>
        <input type="file" id="file-input">
        <br>
        <button id="send-btn">Enviar Archivo</button>
    </div>

    <div class="box">
        <h3>Estado del Canal</h3>
        <div id="status" class="status">Conectando al servidor de señales...</div>
        <a id="downloadLink" href="#" download>¡Descargar Archivo Recibido!</a>
    </div>

    <script>
        // SOLUCIÓN 2: Forzamos los parámetros de red correctos para el servidor público actual de PeerJS
        const peer = new Peer({
            host: '://peerjs.com',
            port: 443,
            path: '/',
            secure: true,
            debug: 1
        });
        
        let conn = null;

        const myIdDisplay = document.getElementById('my-id');
        const statusDisplay = document.getElementById('status');
        const errorLog = document.getElementById('error-log');
        const peerIdInput = document.getElementById('peer-id-input');
        const fileInput = document.getElementById('file-input');
        const sendBtn = document.getElementById('send-btn');
        const downloadLink = document.getElementById('downloadLink');

        // Asignación de ID exitosa
        peer.on('open', (id) => {
            myIdDisplay.innerText = id;
            statusDisplay.innerText = "Listo. Comparte tu ID o introduce el de tu par para conectar.";
            errorLog.innerText = ""; 
        });

        // Captura activa de errores para diagnóstico en pantalla
        peer.on('error', (err) => {
            console.error("Error detectado:", err);
            statusDisplay.innerText = "Conexión interrumpida.";
            myIdDisplay.innerText = "Error de Red";
            errorLog.innerText = `Error [${err.type}]: No se pudo validar la sesión P2P.`;
        });

        // Escuchar conexiones de archivos entrantes
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnectionHandlers();
        });

        // Evento para iniciar el enlace y transferencia
        sendBtn.addEventListener('click', () => {
            const targetId = peerIdInput.value.trim();
            if (!targetId) {
                alert("Por favor, introduce el ID del destinatario.");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("Selecciona un archivo antes de enviarlo.");
                return;
            }
            
            statusDisplay.innerText = "Abriendo túnel directo WebRTC...";
            conn = peer.connect(targetId);
            
            conn.on('open', () => {
                setupConnectionHandlers();
                setTimeout(enviarArchivo, 400);
            });
        });

        function setupConnectionHandlers() {
            statusDisplay.innerText = `Conectado con el par: ${conn.peer}`;
            
            conn.on('data', (data) => {
                if (data.file && data.filename) {
                    statusDisplay.innerText = `¡Archivo recibido con éxito!`;
                    
                    const blob = new Blob([data.file]);
                    const url = URL.createObjectURL(blob);
                    
                    downloadLink.href = url;
                    downloadLink.download = data.filename;
                    downloadLink.innerText = `Guardar ${data.filename} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;
                    downloadLink.style.display = "inline-block";
                }
            });

            conn.on('close', () => {
                statusDisplay.innerText = "La conexión P2P se ha cerrado.";
                conn = null;
            });
        }

        function enviarArchivo() {
            const file = fileInput.files[0];
            statusDisplay.innerText = `Transmitiendo "${file.name}" de forma directa...`;

            const reader = new FileReader();
            reader.onload = function(event) {
                if(conn && conn.open) {
                    conn.send({
                        file: event.target.result,
                        filename: file.name
                    });
                    statusDisplay.innerText = `¡"${file.name}" se envió correctamente!`;
                } else {
                    statusDisplay.innerText = "Error: El canal se cerró antes del envío.";
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
