

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transferencia P2P de Archivos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 30px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      text-align: center;
    }
    .section {
      margin-bottom: 20px;
    }
    .section-title {
      font-weight: 600;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      font-family: monospace;
      resize: none;
    }
    button {
      background: #007aff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    input[type="file"] {
      margin-bottom: 10px;
    }
    .status {
      font-size: 0.9rem;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 Transferencia P2P</h1>
    
    <div class="section">
      <div class="section-title">1. Crear conexión</div>
      <button id="create">Generar Oferta</button>
      <textarea id="offer" placeholder="La oferta aparecerá aquí" rows="4"></textarea>
    </div>
    
    <div class="section">
      <div class="section-title">2. Conectar</div>
      <textarea id="remoteOffer" placeholder="Pega la oferta aquí" rows="4"></textarea>
      <button id="connect">Conectar</button>
    </div>
    
    <div class="section">
      <div class="section-title">3. Enviar Archivo</div>
      <input type="file" id="file">
      <button id="send" disabled>Enviar Archivo</button>
      <div id="status" class="status">Esperando conexión...</div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
